[package]
name = "delegation-server"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
ed25519-dalek = "2"
rand = "0.8"
anyhow = "1"
uuid = { version = "=1.10.0", features = ["v4"] }

# Pinned purely because this is being prototyped against a distro-packaged
# (apt) Rust 1.75 toolchain, which can't build crates that have since
# moved to Rust's 2024 edition. On a rustup-installed current stable,
# these pins almost certainly aren't necessary — see the hurdles writeup
# from the earlier scaffold for the full story on why this keeps happening.
hyper-util = "=0.1.10"
getrandom = "=0.2.15"
