# Run from inside server/ exactly as before (`docker compose up -d --build`)
# — `context: ..` reaches up to the repo root so the build can see the
# shared protocol/ crate, but the command-line usage doesn't change.
services:
  delegation-server:
    # deploy.sh sets DELEGATION_IMAGE/DELEGATION_TAG in .env to a CI-built
    # GHCR image. Without them, `--build` builds locally as before.
    image: ${DELEGATION_IMAGE:-delegation-server}:${DELEGATION_TAG:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Shared settings (see config.env.example). Optional: without it the
    # binary uses its built-in defaults.
    env_file:
      - path: ../config.env
        required: false
    volumes:
      - server-data:/app/data
    # Deliberately no `ports:` mapping — cloudflared reaches this
    # container over the internal compose network by service name.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      # Same tunnel/token as before — only the origin's internals
      # changed (Node -> Rust); the dashboard route config does not:
      # http://delegation-server:7070 still resolves to this same
      # service name on the compose network.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    # Lets the tunnel's SSH route (ssh://host.docker.internal:22) reach the
    # host's sshd for CI deploys (docs/DEV-USAGE-AND-DEPLOYMENT.md §2.8).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - delegation-server

volumes:
  server-data:
