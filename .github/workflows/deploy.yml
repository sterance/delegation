# Managed by onboard-repo.sh — pipeline logic lives in sterance/infra
name: deploy
# Pushes to main reach this through ci.yml's deploy job, after CI passes.
# A manual run deploys straight away, without waiting for CI.
on:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write }
jobs:
  backend:
    uses: sterance/infra/.github/workflows/deploy-backend.yml@main
    with:
      bao_addr: ${{ vars.BAO_ADDR }}
      target: ${{ vars.DEPLOY_TARGET }}
      port: "7070"
      dockerfile: "server/Dockerfile"
      data_dir: "/app/data"
      subdomain: "llm"
