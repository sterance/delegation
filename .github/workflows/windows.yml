# Builds the Windows tray client and its installer. ci.yml calls this after
# its checks pass, for PRs and pushes to main; it can also be run by hand, which
# skips CI. Pushes to main also sign both (see "Signing" below and
# installer/SIGNING.md) and publish them as a GitHub Release (tag
# v<APP_VERSION>), marked latest; for PRs and manual runs, download the
# unsigned builds from the run's "Artifacts" section instead.
name: Windows

on:
  workflow_call:
    secrets:
      SIGNPATH_API_TOKEN:
        required: false
      SELF_SIGN_PFX_BASE64:
        required: false
      SELF_SIGN_PFX_PASSWORD:
        required: false
  workflow_dispatch:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  tray:
    runs-on: windows-latest
    # SignPath reads the unsigned files from this run's artifacts.
    permissions:
      contents: read
      actions: read
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
      thumbprint: ${{ steps.self-sign-tray.outputs.thumbprint }}
    env:
      APP_VERSION: 0.1.0.${{ github.run_number }}
      # How releases are signed: the repository variable WINDOWS_SIGNING,
      #   signpath     through SignPath (SIGNPATH_* variables and token)
      #   self-signed  with the certificate in SELF_SIGN_PFX_* (made by
      #                installer/make-self-signed-cert.sh)
      # and unsigned when it's unset. Only pushes to main are ever signed
      # (never PR code); everything else is "none".
      SIGNING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING || 'none' }}
    steps:
      - uses: actions/checkout@v7
      # The version in rust-toolchain.toml (as in ci.yml).
      - id: toolchain
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"\r\?$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Third-party actions are pinned to commits (Dependabot updates them).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test -p delegation-client

      - name: Build
        run: cargo build --release -p delegation-client --bin delegation-tray

      # A quick check of the Windows collectors on the runner's (virtual)
      # hardware. Piping makes PowerShell wait for the GUI-subsystem exe
      # and capture its output.
      - name: Hardware report
        shell: pwsh
        run: |
          $json = & .\target\release\delegation-tray.exe --dump-specs | Out-String
          Write-Output $json
          $null = $json | ConvertFrom-Json

      - name: Signing
        id: signing
        shell: pwsh
        run: |
          $modes = 'none', 'signpath', 'self-signed'
          if ($env:SIGNING -notin $modes) { throw "WINDOWS_SIGNING is '$env:SIGNING'; use signpath or self-signed, or delete it." }
          "mode=$env:SIGNING" >> $env:GITHUB_OUTPUT
          Write-Output "Signing: $env:SIGNING"

      # ---- Sign the tray exe first, so the installer packages the signed one ----

      # SignPath
      - name: Upload unsigned tray exe
        id: unsigned-tray
        if: env.SIGNING == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-tray
          path: target/release/delegation-tray.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign tray exe (SignPath)
        if: env.SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-tray.outputs.artifact-id }}
          wait-for-completion: true
          # Room for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/tray

      - name: Use the SignPath-signed tray exe
        if: env.SIGNING == 'signpath'
        shell: pwsh
        run: Copy-Item signed\tray\delegation-tray.exe target\release\delegation-tray.exe -Force

      # Self-signed
      - name: Sign tray exe (self-signed)
        id: self-sign-tray
        if: env.SIGNING == 'self-signed'
        shell: pwsh
        env:
          SELF_SIGN_PFX_BASE64: ${{ secrets.SELF_SIGN_PFX_BASE64 }}
          SELF_SIGN_PFX_PASSWORD: ${{ secrets.SELF_SIGN_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force installer\Output | Out-Null
          ./installer/self-sign.ps1 -Path target\release\delegation-tray.exe -ExportCer installer\Output\DelegationTray-signing-certificate.cer

      - name: Check tray exe signature
        if: env.SIGNING != 'none'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target\release\delegation-tray.exe
          Write-Output "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      # Exactly the version in installer/inno-setup-version, so a release
      # is reproducible (the weekly dependency update changes that file).
      # The runner's preinstalled copy is used only if it's that version.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $want = (Get-Content installer\inno-setup-version -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          function Get-InnoVersion {
            if (-not (Test-Path $iscc)) { return 'none' }
            $v = (Get-Item $iscc).VersionInfo
            "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart)"
          }
          $have = Get-InnoVersion
          Write-Output "Inno Setup: pinned $want, runner has $have"
          if ($have -ne $want) {
            choco install innosetup --version $want --allow-downgrade --force --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "Installed Inno Setup $(Get-InnoVersion)"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $want = (Get-Content installer\inno-setup-version -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION installer\delegation.iss | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The compiler says which version it is; it must be the pinned one.
          if (-not (($log -join "`n") -match "Compiler engine version: Inno Setup $([regex]::Escape($want))\b")) {
            throw "the installer wasn't built with Inno Setup $want (installer/inno-setup-version)"
          }

      # ---- Then the installer itself ----

      # SignPath
      - name: Upload unsigned installer
        id: unsigned-installer
        if: env.SIGNING == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: installer/Output/DelegationTray-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (SignPath)
        if: env.SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer

      - name: Use the SignPath-signed installer
        if: env.SIGNING == 'signpath'
        shell: pwsh
        run: |
          $name = "DelegationTray-Setup-$env:APP_VERSION.exe"
          Copy-Item "signed\installer\$name" "installer\Output\$name" -Force

      # Self-signed
      - name: Sign installer (self-signed)
        if: env.SIGNING == 'self-signed'
        shell: pwsh
        env:
          SELF_SIGN_PFX_BASE64: ${{ secrets.SELF_SIGN_PFX_BASE64 }}
          SELF_SIGN_PFX_PASSWORD: ${{ secrets.SELF_SIGN_PFX_PASSWORD }}
        run: ./installer/self-sign.ps1 -Path "installer\Output\DelegationTray-Setup-$env:APP_VERSION.exe"

      - name: Check installer signature
        if: env.SIGNING != 'none'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "installer\Output\DelegationTray-Setup-$env:APP_VERSION.exe"
          Write-Output "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: DelegationTray-Setup-${{ env.APP_VERSION }}
          path: installer/Output/DelegationTray-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      # The tray is a single exe, so it also runs without installing.
      - name: Portable exe
        shell: pwsh
        run: Copy-Item target\release\delegation-tray.exe "installer\Output\DelegationTray-$env:APP_VERSION-portable.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: DelegationTray-${{ env.APP_VERSION }}-portable
          path: installer/Output/DelegationTray-${{ env.APP_VERSION }}-portable.exe
          if-no-files-found: error

      # Self-signed releases include the public certificate, for anyone who
      # wants to check signatures against it or trust it.
      - uses: actions/upload-artifact@v7
        if: env.SIGNING == 'self-signed'
        with:
          name: DelegationTray-signing-certificate
          path: installer/Output/DelegationTray-signing-certificate.cer
          if-no-files-found: error

  # Only pushes to main publish a release: PR builds and manual runs stay as
  # artifacts. Kept as a separate job so the build job (which runs PR code)
  # never gets write access.
  release:
    needs: tray
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Same run, so the same number as the build job's APP_VERSION.
      VERSION: 0.1.0.${{ github.run_number }}
      SIGNING: ${{ needs.tray.outputs.signing }}
      THUMBPRINT: ${{ needs.tray.outputs.thumbprint }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: DelegationTray-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps the same run_number, so the release may already
        # exist: then replace its files instead of failing on the tag.
        run: |
          policy="Code signing policy: https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
          case "$SIGNING" in
            signpath)
              signing="Free code signing provided by SignPath.io, certificate by SignPath Foundation. $policy" ;;
            self-signed)
              signing="Signed with the project's self-signed certificate (SHA-1 thumbprint $THUMBPRINT, included as DelegationTray-signing-certificate.cer). Windows doesn't trust it by default, so SmartScreen still warns (More info, then Run anyway). $policy" ;;
            *)
              signing="Not code signed: SmartScreen will warn (More info, then Run anyway)." ;;
          esac
          # The certificate is only there for self-signed releases.
          shopt -s nullglob
          files=(dist/*.exe dist/*.cer)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "v$VERSION" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Delegation tray $VERSION" \
              --notes "Windows tray client built from $GITHUB_SHA. Install with DelegationTray-Setup-$VERSION.exe, or run the portable exe without installing. $signing" \
              --latest
          fi
