# Tests every PR and every push to main. The Windows build and the server
# deploy run as the last jobs of this same workflow (they're reusable
# workflows called below), so neither starts unless every check here
# passes, and a push to main shows up as one run instead of three.
#
# Pushes to other branches don't run CI on their own: open a PR. Otherwise
# a PR from a branch in this repo would get two runs of the same commit,
# and the push run's skipped Windows job could count as the required
# `windows / tray` check before the PR run's real one finished.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version in rust-toolchain.toml, which the weekly dependency
      # update changes (so this file never needs to).
      - id: toolchain
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"\r\?$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Third-party actions are pinned to commits (Dependabot updates them).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Node only builds the frontend (dev and CI): the server serves the
      # built files and the client never needs it. The major version is in
      # frontend/.nvmrc (the same as server/Dockerfile's image).
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The llama.cpp dependency check (offline tests). The other checks are
  # built into infra's dependency updates, and tested there.
  update-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/updates -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build client image
        run: docker build -f client/Dockerfile -t delegation-client .
      - name: Build server image
        run: docker build -f server/Dockerfile -t delegation-server .

  # Builds the tray app and installer for PRs and pushes to main; on pushes
  # to main it also signs them (as the WINDOWS_SIGNING variable says, see
  # installer/SIGNING.md) and publishes a GitHub Release, which needs
  # contents: write. actions: read lets SignPath fetch the unsigned files
  # from the run.
  windows:
    needs: [rust, frontend, docker]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: write
      actions: read
    # Only the signing secrets; the build never sees other secrets.
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SELF_SIGN_PFX_BASE64: ${{ secrets.SELF_SIGN_PFX_BASE64 }}
      SELF_SIGN_PFX_PASSWORD: ${{ secrets.SELF_SIGN_PFX_PASSWORD }}

  # A called workflow can't have more permissions than its caller grants,
  # so these match deploy.yml's.
  deploy:
    needs: [rust, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    permissions: { contents: read, packages: write, id-token: write }
    secrets: inherit
