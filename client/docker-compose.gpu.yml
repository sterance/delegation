# NVIDIA GPUs: in the hardware report, the live usage metrics, and for
# inference with the pinned CUDA builds of llama.cpp. Needs the NVIDIA
# Container Toolkit on the host, which is why it's a separate file: the
# base compose file must still start on machines without it.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# `utility` mounts NVML (libnvidia-ml) into the container; `compute` mounts
# the CUDA driver (libcuda), which the CUDA builds need. The CUDA runtime
# and cuBLAS come from the pinned `cudart` archive the client downloads.
# Check with:
#   docker compose exec delegation-client sh -c \
#     '/root/.local/share/delegation-client/runtime/cuda-*/llama-server --list-devices'
services:
  delegation-client:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
