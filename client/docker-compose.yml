services:
  delegation-client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      DELEGATION_SERVER: ${DELEGATION_SERVER:-https://llm.smith-c.com}
      PAIRING_CODE: ${PAIRING_CODE:-}
    volumes:
      - agent-identity:/root/.config/delegation-client

volumes:
  agent-identity:
