services:
  delegation-agent:
    build: .
    restart: unless-stopped
    env_file:
      - ../config.env
    environment:
      DELEGATION_SERVER: ${DELEGATION_SERVER:-https://llm.smith-c.com}
      PAIRING_CODE: ${PAIRING_CODE:-}
    volumes:
      - agent-identity:/root/.config/delegation-agent

volumes:
  agent-identity:
