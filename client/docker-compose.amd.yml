# AMD (and Intel) GPUs: in the hardware report, and for inference with the
# pinned Vulkan build of llama.cpp.
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml up -d --build
# Builds the image's `vulkan` stage (the Vulkan loader and Mesa's drivers,
# which the default image leaves out for size) and passes the DRM device
# nodes through, which Vulkan uses. /dev/kfd is for ROCm, later.
# The client finds GPUs through /sys/class/drm either way.
services:
  delegation-client:
    build:
      target: vulkan
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
