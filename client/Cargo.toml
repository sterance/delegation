[package]
name = "delegation-agent"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# NOTE: several of these are pinned to older patch/minor versions purely
# because this scaffold was prototyped against a distro-packaged Rust
# 1.75 toolchain (see the guide's "hurdles" section). On a real dev
# machine, install Rust via rustup instead of apt/dnf and these pins
# almost certainly aren't necessary — try removing them first.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = { version = "=0.20.1", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
ed25519-dalek = { version = "=2.0.0", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
ureq = { version = "2", features = ["json", "tls"] }
anyhow = "1"
base64ct = "=1.6.0"
zeroize = "=1.7.0"
url = "=2.4.1"
idna = "=0.4.0"
